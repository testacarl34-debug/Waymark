9.344/4*60,v=d/1609.344/20*60,best=w<=v?'walk':'drive';t.innerHTML=`<h3>Getting there from your location</h3><div class="legend"><div class="${best==='walk'?'best':''}">🚶 Walking · ${fmtD(d)} · ~${fmtT(w)}</div><div class="${best==='drive'?'best':''}">🚗 Driving · ${fmtD(d)} · ~${fmtT(v)}</div><div class="tip">Recommended: ${best==='walk'?'🚶 walk':'🚗 drive'} · leave about ${fmtT(Math.min(w,v))} before you need to arrive.</div><div class="est">Straight-line estimate with typical city traffic and lights — actual times are usually longer and not exact.</div><div class="go-row"><button class="tiny secondary" data-dir="foot">🚶 Walking directions</button><button class="tiny secondary" data-dir="car">🚗 Driving directions</button></div></div>`}$('#viewer').showModal()}
async function startDir(p,mode){let m=mode==='foot'?'walking':'driving';if(!confirm(`Get ${m} directions to ${p.name}?`))return;let t=$('#vtravel');t.innerHTML='<h3>Getting directions…</h3><p class="nodata">One moment…</p>';let fb=`<div class="legend"><div class="tip">Couldn’t load turn-by-turn directions right now.</div><div class="go-row"><a class="tiny secondary" target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?from=${me.lat}%2C${me.lng}&to=${p.lat}%2C${p.lng}">Open directions in OpenStreetMap ↗</a></div></div>`;try{let r=await fetch(`https://router.project-osrm.org/route/v1/${mode}/${me.lng},${me.lat};${p.lng},${p.lat}?overview=false&steps=true`);let j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw 0;let rt=j.routes[0],legs=rt.legs[0].steps.map(s=>{let n=s.maneuver,base={depart:'Head out',arrive:'Arrive at your destination','new name':'Continue','continue':'Continue',merge:'Merge',roundabout:'Take the roundabout',rotary:'Enter the rotary',turn:'Turn',fork:'Keep','end of road':'At the end of the road',notification:'Note','off ramp':'Take the exit','on ramp':'Take the ramp'}[n.type]||n.type,txt=base+(n.modifier&&n.type!=='depart'&&n.type!=='arrive'?` ${n.modifier}`:'');return`<li>${esc(txt)}${s.name?` onto <b>${esc(s.name)}</b>`:''}<span class="step-d"> · ${fmtD(s.distance)}</span></li>`}).join('');let est=rt.duration/60*(mode==='foot'?1.05:1.25)+1;t.innerHTML=`<h3>${m==='walking'?'🚶 Walking':'🚗 Driving'} to ${esc(p.name)}</h3><div class="legend"><div class="best">${fmtD(rt.distance)} · about ${fmtT(est)}</div></div><ol class="steps">${legs}</ol><div class="est">Time is estimated with typical city traffic and lights — not exact.</div>`}catch(e){t.innerHTML=`<h3>Directions</h3>${fb}`}}
$('#list').onclick=e=>{let t=e.target.dataset.t;if(t){travel(places.find(x=>x.id===t));return}let v=e.target.dataset.v;if(v){travel(places.find(x=>x.id===v));return}let id=e.target.dataset.e||e.target.dataset.d;if(!id)return;if(!confirm('Delete this place?'))return;api('DELETE','/api/places/'+id,0).then(()=>refresh())};$('#search').oninput=draw;document.querySelectorAll('#kinds .filter').forEach(b=>b.onclick=()=>{filter=b.dataset.k;document.querySelectorAll('#kinds .filter').forEach(x=>x.classList.toggle('active',x===b));draw()});document.querySelectorAll('#cats .filter').forEach(b=>b.onclick=()=>{catFilter=b.dataset.c;document.querySelectorAll('#cats .filter').forEach(x=>x.classList.toggle('active',x===b));draw()});draw();
function renderReviews(p){let rv=p.reviews||[];$('#vreviews').innerHTML=rv.length?rv.map(r=>`<div class="rev"><b>${esc(r.username)}</b> <span class="kind ${r.kind}">${r.kind==='go'?'Good':r.kind==='save'?'Okay':'Avoid'}</span> <span class="rt">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><div>${esc(r.text||'')}</div></div>`).join(''):'<p class="nodata">No reviews yet — tap a place and be first.</p>'}
let token=localStorage.getItem('waymark-session'),meUser=null,mapId=null,maps=[],isLogin=true;
async function api(method,url,b){let h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;let r=await fetch(url,{method,headers:h,body:b===undefined?undefined:JSON.stringify(b)});if(r.status===401){logout();return null}let d=null;try{d=await r.json()}catch(e){}if(!r.ok){if(d&&d.error)notice(d.error,true);return null}return d}
function logout(){localStorage.removeItem('waymark-session');token=null;meUser=null;$('#auth').showModal()}
async function boot(){let d=await api('GET','/api/maps');if(!d){$('#auth').showModal();return}maps=d.maps;if(!maps.length){notice('No maps found',true);return}if(!localStorage.getItem('waymark-imported')){let old=[];try{old=JSON.parse(localStorage.getItem('waymark-pins')||'[]')}catch(e){}if(old.length){for(let p of old)await api('POST','/api/maps/'+maps[0].id+'/places',p);localStorage.removeItem('waymark-pins')}localStorage.setItem('waymark-imported','1')}mapId=maps[0].id;$('#who').textContent=meUser?.username||'';$('#whoname').textContent=meUser?.username||'';$('#mycode').textContent=meUser?.code||'';renderMaps();refresh();$('#auth').close()}
async function refresh(){let d=await api('GET','/api/maps/'+mapId);if(!d)return;places=d.places;draw()}
function renderMaps(){$('#maplist').innerHTML=maps.map(m=>`<div class="mapitem"><span class="n">${esc(m.name)}</span><span class="s">${m.personal?'🔒 private':m.mine?'👑 yours':'👥 '+esc(m.ownerName||'')}</span><button class="tiny ${m.id===mapId?'primary':'secondary'}" data-open="${m.id}">${m.id===mapId?'On':'Open'}</button>${m.mine&&!m.personal?`<button class="tiny secondary" data-delmap="${m.id}">×</button>`:''}</div>`).join('')||'<p class="nodata">No maps yet.</p>';$('#maplist').onclick=e=>{let o=e.target.dataset.open;if(o){mapId=o;refresh();renderMaps()}let d=e.target.dataset.delmap;if(d&&confirm('Delete this map and its places?'))api('DELETE','/api/maps/'+d).then(()=>{maps=maps.filter(x=>x.id!==d);if(mapId===d)mapId=maps[0]?.id;renderMaps();refresh()})}}
$('#mapbtn').onclick=()=>{renderMaps();$('#mapdlg').showModal()};$('#mapclose').onclick=()=>$('#mapdlg').close();
async function renderFriends(){let f=await api('GET','/api/friends');if(!f)return;$('#frlist').innerHTML=[...f.incoming.map(x=>`<div class="mapitem"><span class="n">${esc(x.username)}</span><span class="s">asked to be friends</span><button class="tiny primary" data-acc="${x.id}">Accept</button></div>`),...f.outgoing.map(x=>`<div class="mapitem"><span class="n">${esc(x.username)}</span><span class="s">request sent</span></div>`),...f.friends.map(x=>`<div class="mapitem"><span class="n">${esc(x.username)}</span><span class="s">friend</span><button class="tiny secondary" data-remove="${x.id}">Remove</button></div>`)].join('')||'<p class="nodata">No friends yet — share your code and add some.</p>';$('#frlist').onclick=e=>{let a=e.target.dataset.acc;if(a)api('POST','/api/friends/accept',{id:a}).then(renderFriends);let d=e.target.dataset.remove;if(d)api('DELETE','/api/friends/'+d).then(renderFriends)}}
$('#frform').onsubmit=async e=>{e.preventDefault();let r=await api('POST','/api/friends/add',{code:$('#frcode').value});if(r){if(r.accepted)notice('Friend added!');renderFriends()}$('#frcode').value=''};
$('#friendsbtn').onclick=()=>{renderFriends();$('#frdlg').showModal()};$('#frclose').onclick=()=>$('#frdlg').close();
$('#logout').onclick=e=>{e.preventDefault();api('POST','/api/logout');logout()};
$('#mapform').onsubmit=async e=>{e.preventDefault();let r=await api('POST','/api/maps',{name:$('#mapname').value});if(r){maps.push(r);mapId=r.id;$('#mapname').value='';renderMaps();refresh()}};
$('#login-tab').onclick=()=>{isLogin=true;$('#login-tab').classList.add('active');$('#reg-tab').classList.remove('active')};

$('#authform').onsubmit=async e=>{e.preventDefault();let r=await api('POST',isLogin?'/api/login':'/api/register',{username:$('#auser').value.trim(),password:$('#apass').value});if(r){localStorage.setItem('waymark-session',r.token);token=r.token;meUser=r.user;$('#aerr').textContent='';boot()}};
