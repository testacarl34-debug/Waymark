<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waymark</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Arial;color:#17251f;height:100vh;overflow:hidden}.app{height:100%;display:grid;grid-template-columns:365px 1fr}.side{background:#fffdfa;border-right:1px solid #dedbd2;padding:25px 22px;display:flex;flex-direction:column;z-index:5;box-shadow:1px 0 14px #17251f0d}.brand{font-size:21px;font-weight:bold;letter-spacing:.2px}.brand:before{content:'●';color:#278568;margin-right:8px}.eyebrow,.label{font-size:11px;letter-spacing:1.2px;color:#6e766f;font-weight:bold}.eyebrow{margin:29px 0 5px}h1{font:700 32px/1.12 Georgia,serif;letter-spacing:-.3px;margin:0 0 20px}.search{background:white;border:1px solid #dedbd2;border-radius:13px;padding:12px;box-shadow:0 1px 4px #17251f0a;transition:border-color .15s,box-shadow .15s}.search:focus-within{border-color:#278568;box-shadow:0 0 0 3px #2785681f}.search input{border:0;outline:0;width:90%;font-size:14px;background:none}.actions{display:flex;gap:9px;margin:13px 0 15px}.actions button{flex:1}button{border:0;border-radius:10px;padding:10px;font-weight:bold;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s,border-color .15s}button:active{transform:scale(.97)}.primary{background:#192820;color:#fff}.primary:hover{background:#278568}.secondary{background:#f0eee8}.secondary:hover{background:#e6e2d7}.label{display:flex;justify-content:space-between}.filters{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.filter{background:white;border:1px solid #dedbd2;border-radius:999px;padding:7px 13px;color:#66716a}.filter:hover{border-color:#b9b3a4;color:#17251f}.filter.active{background:#192820;color:white;border-color:#192820}#list{overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#d8d5cd transparent}.place{display:flex;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px solid #eeeae3;border-radius:12px;transition:background .15s}.place:hover{background:#f7f4ed}.badge{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;font-weight:bold;font-style:normal;font-size:15px}.go{background:#e4f3eb;color:#238262}.avoid{background:#fae8e5;color:#c7584a}.save{background:#fbf0dd;color:#b87925}.copy{flex:1}.meta{font-size:12px;color:#6e766f;margin-top:3px}.stars{color:#b87925}.thumb{width:34px;height:34px;border-radius:9px;object-fit:cover;cursor:pointer;border:1px solid #d8d5cd;transition:transform .15s}.thumb:hover{transform:scale(1.08)}.tiny{padding:6px 9px;font-size:11px}.footer{border-top:1px solid #dedbd2;padding-top:14px;color:#6e766f;font-size:12px}.map{position:relative;overflow:hidden;background:#e6ede7;touch-action:none;cursor:grab}.map.drag{cursor:grabbing}#tiles,#pins{position:absolute;inset:0;pointer-events:none}.tile{position:absolute;width:256px;height:256px}.pin{position:absolute;transform:translate(-50%,-100%);z-index:3;display:grid;justify-items:center;gap:4px}.pin label{background:white;padding:4px 7px;border:1px solid #d9ded9;border-radius:6px;box-shadow:0 2px 7px #17251f35;font-size:12px;font-weight:bold;white-space:nowrap}.pin .mark{position:relative;width:34px;height:42px;display:grid;place-items:center}.pin i{font-style:normal;font-size:30px;line-height:1;filter:drop-shadow(0 2px 3px #17251f44);padding-bottom:7px}.pin .mark:after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top:8px solid #fff;filter:drop-shadow(0 2px 2px #17251f33)}.pin .dot{position:absolute;top:-2px;right:-4px;width:12px;height:12px;border-radius:50%;border:2px solid white;box-shadow:0 2px 5px #17251f44}.pin.go .dot{background:#238262}.pin.save .dot{background:#b87925}.pin.avoid .dot{background:#c7584a}.pin.user{transform:translate(-50%,-50%);z-index:4}.pin.user .mark{width:20px;height:20px;display:block}.pin.user .mark:after{display:none}.pin.user i{background:#3266d7;border:3px solid white;border-radius:50%;width:20px;height:20px;padding:0;font-size:0;box-shadow:0 0 0 7px #3266d733,0 2px 7px #17251f55}.pin.user label{color:#3266d7}.tools{position:absolute;z-index:4;top:20px;right:20px;display:grid;gap:8px}.tools button{background:white;width:40px;height:40px;padding:0;font-size:20px;border-radius:12px;box-shadow:0 3px 12px #17251f22}.tools button:hover{box-shadow:0 5px 16px #17251f33}.notice{display:none;position:absolute;z-index:5;top:20px;left:20px;max-width:330px;background:white;border:1px solid #d9ded9;border-radius:13px;padding:11px 14px;box-shadow:0 6px 18px #17251f2e}.notice.show{display:block}.notice.error{color:#953f32;border-color:#e9b8b1}dialog{border:0;border-radius:20px;padding:24px;width:min(410px,calc(100% - 30px));box-shadow:0 24px 70px #17251f59}dialog::backdrop{background:#17251f80}.form label{display:grid;gap:5px;font-size:12px;font-weight:bold;margin:11px 0}.form input,.form select,.form textarea{border:1px solid #d8d5cd;border-radius:10px;padding:10px;font:inherit;transition:border-color .15s,box-shadow .15s;background:#fff}.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:#278568;box-shadow:0 0 0 3px #2785681f}.form input[type=file]{font-size:11px;color:#6e766f;padding:8px;width:100%}.form textarea{min-height:70px}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}.thumbs .th{position:relative}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #d8d5cd;display:block}.thumbs .del{position:absolute;top:-7px;right:-7px;width:19px;height:19px;padding:0;border-radius:50%;background:#192820;color:#fff;font-size:11px;line-height:1}.form-actions{text-align:right;margin-top:17px}.form-actions button{margin-left:7px}.close{float:right;background:none;padding:0;font-size:21px}#viewer{width:min(720px,calc(100% - 30px))}#vphotos{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}#vphotos img{max-width:100%;max-height:65vh;border-radius:9px}.travel{margin-top:15px;border-top:1px solid #eeeae3;padding-top:13px}.travel h3{margin:0 0 9px;font-size:13px}.travel .legend{display:grid;gap:6px}.travel .legend div{font-size:13px}.travel .legend .best{font-weight:bold}.travel .legend .tip{grid-column:1/-1;color:#238262;font-weight:bold;margin-top:2px}.travel .legend .est{grid-column:1/-1;font-size:11px;color:#6e766f;font-style:italic}.travel .nodata{font-size:12px;color:#6e766f}@media(max-width:760px){body{overflow:auto}.app{display:block;height:auto}.side{height:55vh;min-height:410px}.map{height:60vh}}
</style></head><body><div class="app"><aside class="side"><div class="brand">waymark</div><p class="eyebrow">YOUR NEIGHBORHOOD</p><h1>Good places,<br>well remembered.</h1><label class="search">⌕ <input id="search" placeholder="Search your places"></label><div class="actions"><button id="add" class="primary">＋ Add a place</button><button id="find" class="secondary">◎ Find me</button></div><div class="label"><span>YOUR MARKS</span><span id="count"></span></div><div class="filters" id="kinds"><button class="filter active" data-k="all">All</button><button class="filter" data-k="go">Good</button><button class="filter" data-k="save">Okay</button><button class="filter" data-k="avoid">Avoid</button></div><div class="filters" id="cats"><button class="filter active" data-c="all">All types</button><button class="filter" data-c="food">🍜 Food</button><button class="filter" data-c="shop">🛒 Shopping</button><button class="filter" data-c="market">🥫 Market</button><button class="filter" data-c="park">🌳 Outdoors</button><button class="filter" data-c="arts">🎭 Arts</button><button class="filter" data-c="home">🏠 Home</button><button class="filter" data-c="other">📍 Other</button></div><div id="list"></div><div class="footer">●&nbsp; Private to this device · saved automatically</div></aside><main id="map" class="map"><div id="tiles"></div><div id="pins"></div><div class="tools"><button id="plus">+</button><button id="minus">−</button><button id="locate" title="Locate me">📍</button><button id="home">⌖</button></div><div id="notice" class="notice"></div></main></div><dialog id="dialog"><form method="dialog" id="form" class="form"><button type="button" id="close" class="close">×</button><h2 id="title">Add a place</h2><label>Place name<input id="name" required placeholder="e.g. Corner Bakery"></label><div class="split"><label>Recommendation<select id="kind"><option value="go">Good place to go</option><option value="save">Okay place</option><option value="avoid">Avoid</option></select></label><label>Type of place<select id="cat"><option value="food">🍜 Food &amp; drink</option><option value="shop">🛒 Shopping</option><option value="market">🥫 Market / supermarket</option><option value="park">🌳 Outdoors</option><option value="arts">🎭 Arts &amp; culture</option><option value="home">🏠 Home</option><option value="other" selected>📍 Other</option></select></label></div><div class="split"><label>Rating<select id="rating"><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select></label><label>Photos<input type="file" id="photo" accept="image/*" multiple></label></div><div id="thumbs" class="thumbs"></div><label>Note<textarea id="note"></textarea></label><div class="form-actions"><button type="button" id="cancel" class="secondary">Cancel</button><button class="primary">Save place</button></div></form></dialog><dialog id="viewer"><button type="button" id="vclose" class="close">×</button><h2>Photos</h2><div id="vphotos"></div><div id="vtravel" class="travel"></div></dialog><script>
const $=s=>document.querySelector(s),map=$('#map'),tiles=$('#tiles'),pins=$('#pins'),home={lat:40.7248,lng:-73.9916,z:15};let state={...home},filter='all',catFilter='all',edit=null,pending=null,drag,me=null,pics=[];const CATS={food:['🍜','Food & drink'],shop:['🛒','Shopping'],market:['🥫','Market / supermarket'],park:['🌳','Outdoors'],arts:['🎭','Arts & culture'],home:['🏠','Home'],other:['📍','Other']};let places=(JSON.parse(localStorage.getItem('waymark-pins')||'null')||[]).map(p=>({cat:'other',photos:[],...p}));const esc=s=>{let d=document.createElement('div');d.textContent=s;return d.innerHTML},stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);function project(lat,lng,z){let n=2**z;return{x:(lng+180)/360*n*256,y:(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n*256}}function unproject(x,y,z){let n=2**z;return{lng:x/256/n*360-180,lat:Math.atan(Math.sinh(Math.PI*(1-2*y/256/n)))*180/Math.PI}}function centerPx(){return project(state.lat,state.lng,state.z)}function hav(a,b,c,d){let R=6371e3,t=Math.PI/180,f1=a*t,f2=c*t,df=(c-a)*t,dl=(d-b)*t,h=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function fmtD(m){return m<1000?`${Math.max(10,Math.round(m/10)*10)} m`:`${(m/1000).toFixed(1)} km`}function fmtT(m){return m<1?'<1 min':m<60?`${Math.round(m)} min`:`${Math.floor(m/60)}h${String(Math.round(m%60)).padStart(2,'0')}`}function draw(){let r=map.getBoundingClientRect(),c=centerPx(),l=Math.floor((c.x-r.width/2)/256),t=Math.floor((c.y-r.height/2)/256),max=2**state.z;tiles.innerHTML='';for(let x=l-1;x<=l+Math.ceil(r.width/256)+1;x++)for(let y=t-1;y<=t+Math.ceil(r.height/256)+1;y++)if(y>=0&&y<max){let im=document.createElement('img');im.className='tile';im.src=`https://tile.openstreetmap.org/${state.z}/${(x%max+max)%max}/${y}.png`;im.style.left=`${x*256-c.x+r.width/2}px`;im.style.top=`${y*256-c.y+r.height/2}px`;tiles.append(im)}pins.innerHTML=places.map(p=>pin(p)).join('')+(me?pin(me,true):'');let q=$('#search').value.toLowerCase(),shown=places.filter(p=>(filter==='all'||filter===p.kind)&&(catFilter==='all'||catFilter===p.cat)&&(`${p.name} ${p.note}`).toLowerCase().includes(q));$('#count').textContent=`${places.length} PLACES`;$('#list').innerHTML=shown.map(p=>`<div class="place"><i class="badge ${p.kind}">${CATS[p.cat][0]}</i><div class="copy"><b>${esc(p.name)}</b><div class="meta"><span class="stars">${stars(p.rating)}</span> · ${CATS[p.cat][1]}${p.photos.length?` · ${p.photos.length} 📷`:''}</div>${me?`<div class="meta">📍 ${fmtD(hav(me.lat,me.lng,p.lat,p.lng))} away</div>`:''}</div><button class="tiny secondary" data-t="${p.id}" title="Travel times">🚶🚗</button>${p.photos.length?`<img class="thumb" src="${p.photos[0]}" data-v="${p.id}" alt="">`:''}<button class="tiny secondary" data-e="${p.id}">Edit</button><button class="tiny secondary" data-d="${p.id}">×</button></div>`).join('')||'<p class="meta">No places yet.</p>'}function pin(p,user=false){let r=map.getBoundingClientRect(),c=centerPx(),a=project(p.lat,p.lng,state.z),x=a.x-c.x+r.width/2,y=a.y-c.y+r.height/2;return`<div class="pin ${user?'user':p.kind}" style="left:${x}px;top:${y}px"><label>${esc(p.name)}</label><span class="mark"><i>${user?'':CATS[p.cat][0]}</i>${user?'':'<b class="dot"></b>'}</span></div>`}function save(){try{localStorage.setItem('waymark-pins',JSON.stringify(places))}catch(e){notice('Storage is full — try removing some photos.',true)}}function notice(t,e=false){let n=$('#notice');n.textContent=t;n.className='notice show'+(e?' error':'');clearTimeout(n.t);n.t=setTimeout(()=>n.className='notice',5000)}function thumbs(){$('#thumbs').innerHTML=pics.map((s,i)=>`<span class="th"><img src="${s}" alt=""><button type="button" class="del" data-i="${i}">×</button></span>`).join('')}function open(p=null){edit=p;pics=p?[...p.photos]:[];p?($('#title').textContent='Edit place',$('#name').value=p.name,$('#kind').value=p.kind,$('#cat').value=p.cat||'other',$('#rating').value=p.rating,$('#note').value=p.note):($('#title').textContent='Add a place',$('#form').reset());$('#photo').value='';thumbs();$('#dialog').showModal()}
map.onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,c:centerPx(),m:false};map.setPointerCapture(e.pointerId);map.classList.add('drag')};map.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m||=Math.abs(dx)+Math.abs(dy)>4;if(drag.m){let p=unproject(drag.c.x-dx,drag.c.y-dy,state.z);state.lat=p.lat;state.lng=p.lng;draw()}};map.onpointerup=e=>{if(!drag)return;let d=drag;drag=null;map.classList.remove('drag');if(!d.m){let r=map.getBoundingClientRect(),c=centerPx();pending=unproject(c.x+e.clientX-r.left-r.width/2,c.y+e.clientY-r.top-r.height/2,state.z);open()}};map.onwheel=e=>{e.preventDefault();state.z=Math.max(2,Math.min(19,state.z+(e.deltaY<0?1:-1)));draw()};$('#plus').onclick=()=>{state.z++;draw()};$('#minus').onclick=()=>{state.z--;draw()};$('#home').onclick=()=>{state={...home};draw()};$('#add').onclick=()=>{pending={lat:state.lat,lng:state.lng};open()};$('#find').onclick=()=>{let b=$('#find');b.textContent='Locating…';navigator.geolocation.getCurrentPosition(x=>{state.lat=x.coords.latitude;state.lng=x.coords.longitude;state.z=16;me={name:'You are here',lat:state.lat,lng:state.lng};pending={lat:state.lat,lng:state.lng};draw();b.textContent='You’re here';startLocate();open();setTimeout(()=>b.textContent='◎ Find me',1800)},()=>{b.textContent='◎ Find me';notice('Please allow location access and try again.',true)},{enableHighAccuracy:true,timeout:12000})};$('#close').onclick=$('#cancel').onclick=()=>$('#dialog').close();$('#vclose').onclick=()=>$('#viewer').close();let watchId=null;function startLocate(){if(watchId!=null)return;if(!navigator.geolocation){notice('Geolocation is not supported on this device.',true);return}watchId=navigator.geolocation.watchPosition(x=>{me={name:'You are here',lat:x.coords.latitude,lng:x.coords.longitude};state.lat=me.lat;state.lng=me.lng;draw()},()=>{notice('Please allow location access and try again.',true)},{enableHighAccuracy:true,maximumAge:5000});notice('GPS on — times are estimated and not exact.')}$('#locate').onclick=startLocate;$('#photo').onchange=e=>{[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pics.push(c.toDataURL('image/jpeg',.75));thumbs()};im.src=r.result};r.readAsDataURL(f)});e.target.value=''};$('#thumbs').onclick=e=>{let i=e.target.dataset.i;if(i!=null){pics.splice(+i,1);thumbs()}};$('#form').onsubmit=()=>{let p={id:edit?.id||crypto.randomUUID(),name:$('#name').value.trim(),kind:$('#kind').value,cat:$('#cat').value,rating:+$('#rating').value,note:$('#note').value.trim(),photos:[...pics],lat:edit?.lat??pending.lat,lng:edit?.lng??pending.lng};if(p.name){let i=places.findIndex(x=>x.id===edit?.id);i<0?places.unshift(p):places[i]=p;save();$('#dialog').close();draw()}};function travel(p){$('#vphotos').innerHTML=p.photos.length?p.photos.map(s=>`<img src="${s}" alt="">`).join(''):'<p class="nodata">No photos for this place yet.</p>';let t=$('#vtravel');if(!me){t.innerHTML='<h3>Getting there</h3><p class="nodata">Tap 📍 on the map to enable GPS, then travel times will appear here.</p>'}else{let d=hav(me.lat,me.lng,p.lat,p.lng),w=d/1000/5*60,v=d/1000/30*60,best=w<=v?'walk':'drive';t.innerHTML=`<h3>Getting there from your location</h3><div class="legend"><div class="${best==='walk'?'best':''}">🚶 Walking · ${fmtD(d)} · ~${fmtT(w)}</div><div class="${best==='drive'?'best':''}">🚗 Driving · ${fmtD(d)} · ~${fmtT(v)}</div><div class="tip">Recommended: ${best==='walk'?'🚶 walk':'🚗 drive'} · leave about ${fmtT(Math.min(w,v))} before you need to arrive.</div><div class="est">Times are estimated and not exact.</div></div>`}$('#viewer').showModal()}
$('#list').onclick=e=>{let t=e.target.dataset.t;if(t){travel(places.find(x=>x.id===t));return}let v=e.target.dataset.v;if(v){travel(places.find(x=>x.id===v));return}let id=e.target.dataset.e||e.target.dataset.d;if(!id)return;e.target.dataset.e?open(places.find(p=>p.id===id)):confirm('Delete this place?')&&(places=places.filter(p=>p.id!==id),save(),draw())};$('#search').oninput=draw;document.querySelectorAll('#kinds .filter').forEach(b=>b.onclick=()=>{filter=b.dataset.k;document.querySelectorAll('#kinds .filter').forEach(x=>x.classList.toggle('active',x===b));draw()});document.querySelectorAll('#cats .filter').forEach(b=>b.onclick=()=>{catFilter=b.dataset.c;document.querySelectorAll('#cats .filter').forEach(x=>x.classList.toggle('active',x===b));draw()});draw();
</script></body></html>
